<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주일학교 | 모현소망교회</title><link rel="stylesheet" href="/css/church.css?v=sundayschool2"><style>.ministry-subnav{position:sticky;top:82px;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.ministry-subnav .container{display:flex;gap:10px;overflow-x:auto;padding-top:12px;padding-bottom:12px;scrollbar-width:none}.ministry-subnav .container::-webkit-scrollbar{display:none}.ministry-subnav a{white-space:nowrap;padding:9px 15px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:800;color:var(--ink);background:#fff}.ministry-subnav a:hover,.ministry-subnav a.active{background:var(--green);color:#fff;border-color:var(--green)}.ss-hero{padding:64px 0;background:linear-gradient(135deg,#eef6f1,#fff8e9)}.ss-head{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center}.ss-hero-img{aspect-ratio:4/3;border-radius:28px;background:#e7efe9 center/cover no-repeat}.ss-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.ss-meta span{padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:800}.ss-list{display:grid;gap:22px}.ss-card{display:grid;grid-template-columns:320px 1fr;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#fff}.ss-photo{min-height:250px;background:#edf3ef center/cover no-repeat}.ss-copy{padding:26px}.ss-copy h2{margin:6px 0 10px}.ss-sections{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.ss-box{padding:14px 16px;border-radius:16px;background:#f7faf8}.ss-box b{display:block;margin-bottom:5px;color:var(--green);font-size:13px}.ss-box p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}@media(max-width:900px){.ministry-subnav{top:0}}@media(max-width:820px){.ss-head,.ss-card{grid-template-columns:1fr}.ss-sections{grid-template-columns:1fr}.ss-photo{aspect-ratio:16/9;min-height:0}}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/"><img class="brand-logo" src="/assets/site/logo.png" alt="모현소망교회 공식 로고"><span class="brand-copy"><small>MOHYEON SOMANG CHURCH</small><strong>모현소망교회</strong></span></a><nav class="navlinks"><a href="/">홈</a><a href="/about.html">교회소개</a><a href="/worship.html">예배안내</a><a class="active" href="/ministries.html">교육·사역</a><a href="/sermons.html">설교</a><a href="/news.html">소식</a><a href="/gallery.html">사진첩</a><a href="/visit.html">오시는 길</a></nav></div></header><nav class="ministry-subnav" aria-label="교육·사역 하위 메뉴"><div class="container"><a href="/ministries.html">교육·사역 홈</a><a class="active" href="/sunday-school.html">주일학교</a><a href="/ministries.html#small-group">사랑방</a><a href="/ministries.html#bible-study">성경공부</a><a href="/ministries.html#prayer">기도 사역</a><a href="/ministries.html#serve">지역 섬김</a><a href="/ministries.html#fellowship">교제와 돌봄</a></div></nav><main><section class="ss-hero"><div class="container ss-head"><div><div class="kicker">SUNDAY SCHOOL</div><h1 id="ssTitle">주일학교</h1><p class="section-lead" id="ssSubtitle"></p><p id="ssIntro"></p><div class="ss-meta"><span id="ssTarget"></span><span id="ssTime"></span><span id="ssPlace"></span></div></div><div class="ss-hero-img" id="ssHeroImage"></div></div></section><section><div class="container"><div class="kicker">WEEKLY NEWS</div><h2 class="section-title">주일학교 소식</h2><div class="ss-list" id="ssWeekly"><p>소식을 불러오는 중입니다.</p></div></div></section></main><footer class="site-footer"><div class="container"><div class="copyright">© 2026 모현소망교회. All rights reserved.</div></div></footer><script src="/js/site-data.js?v=sundayschool1"></script><script>(async()=>{const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));try{const r=await fetch('/content/sunday-school.json?v='+Date.now(),{cache:'no-store'});const d=await r.json();document.getElementById('ssTitle').textContent=d.title||'주일학교';document.getElementById('ssSubtitle').textContent=d.subtitle||'';document.getElementById('ssIntro').textContent=d.intro||'';document.getElementById('ssTarget').textContent=d.target||'';document.getElementById('ssTime').textContent=d.time||'';document.getElementById('ssPlace').textContent=d.place||'';if(d.heroImage)document.getElementById('ssHeroImage').style.backgroundImage=`url('${d.heroImage}')`;const list=[...(d.weekly||[])].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));document.getElementById('ssWeekly').innerHTML=list.map(x=>`<article class="ss-card">${x.image?`<div class="ss-photo" style="background-image:url('${e(x.image)}')"></div>`:''}<div class="ss-copy"><div class="date">${e(x.date)}</div><h2>${e(x.title)}</h2>${x.scripture?`<p><b>${e(x.scripture)}</b></p>`:''}<p>${e(x.summary)}</p><div class="ss-sections">${x.activity?`<div class="ss-box"><b>말씀 활동</b><p>${e(x.activity)}</p></div>`:''}${x.familyGuide?`<div class="ss-box"><b>가정에서 함께</b><p>${e(x.familyGuide)}</p></div>`:''}${x.prayer?`<div class="ss-box"><b>기도제목</b><p>${e(x.prayer)}</p></div>`:''}${x.nextWeek?`<div class="ss-box"><b>다음 주 안내</b><p>${e(x.nextWeek)}</p></div>`:''}</div></div></article>`).join('')||'<p>등록된 소식이 없습니다.</p>'}catch(err){console.warn(err)}})();</script></body></html>
