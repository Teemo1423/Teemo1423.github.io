<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주일예배 설교 | 모현소망교회</title><link rel="stylesheet" href="/css/church.css?v=sermonlist1"><style>.sermon-board{border-top:2px solid var(--ink);background:#fff}.sermon-row{border-bottom:1px solid var(--line);scroll-margin-top:110px}.sermon-head{width:100%;display:grid;grid-template-columns:130px 1fr auto;gap:22px;align-items:center;padding:22px 10px;background:#fff;border:0;text-align:left;color:var(--ink);cursor:pointer;font:inherit}.sermon-head:hover{background:#f8faf8}.sermon-date{color:var(--green);font-size:14px;font-weight:800}.sermon-title-wrap strong{display:block;font-size:20px;line-height:1.35}.sermon-title-wrap span{display:block;margin-top:5px;color:var(--muted);font-size:14px;line-height:1.5}.sermon-toggle{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--green);font-size:20px;transition:.2s;background:#fff}.sermon-row.open .sermon-toggle{transform:rotate(90deg);background:#eef5f1}.sermon-detail{display:none;padding:0 10px 26px}.sermon-row.open .sermon-detail{display:grid}.sermon-detail-inner{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:26px;padding:24px;border-radius:20px;background:#f7faf8}.sermon-media{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#e7eee9}.sermon-media img{width:100%;height:100%;object-fit:cover;display:block}.sermon-media.video-preview:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.22));pointer-events:none}.sermon-play{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:44px;border-radius:13px;background:#ff0033;box-shadow:0 8px 24px rgba(0,0,0,.24);display:grid;place-items:center;pointer-events:none}.sermon-play:before{content:"";margin-left:4px;border-left:16px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}.sermon-copy h3{font-size:27px;margin:0 0 10px}.sermon-copy p{margin:0;color:var(--muted);line-height:1.8}.sermon-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.sermon-watch{display:inline-flex;align-items:center;padding:10px 15px;border-radius:999px;background:var(--green);color:#fff;font-size:13px;font-weight:800}.sermon-empty{padding:42px 10px;color:var(--muted)}@media(max-width:760px){.sermon-head{grid-template-columns:1fr auto;gap:12px;padding:18px 4px}.sermon-date{grid-column:1/2;font-size:12px;margin-bottom:-4px}.sermon-title-wrap{grid-column:1/2}.sermon-title-wrap strong{font-size:18px}.sermon-title-wrap span{font-size:13px}.sermon-toggle{grid-column:2;grid-row:1/3;width:36px;height:36px}.sermon-detail{padding:0 0 18px}.sermon-detail-inner{grid-template-columns:1fr;padding:18px;gap:18px}.sermon-copy h3{font-size:23px}}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/"><img class="brand-logo" src="/assets/site/logo.png" alt="모현소망교회 공식 로고"><span class="brand-copy"><small>MOHYEON SOMANG CHURCH</small><strong>모현소망교회</strong></span></a><nav class="navlinks"></nav></div></header><main><section class="page-hero"><div class="container"><div class="kicker">SUNDAY SERMONS</div><h1>주일예배 설교</h1><p>주일예배에서 선포된 말씀을 날짜순으로 다시 묵상할 수 있습니다.</p></div></section><section><div class="container"><div id="sermonList" class="sermon-board"><div class="sermon-empty">설교 목록을 불러오는 중입니다.</div></div></div></section></main><footer class="site-footer"><div class="container"><div class="brand"><img class="brand-logo" src="/assets/site/logo-footer-green.png" alt="모현소망교회 공식 로고"><span class="brand-copy"><small>MOHYEON SOMANG CHURCH</small><strong>모현소망교회</strong></span></div><div class="copyright">© 2026 모현소망교회. All rights reserved.</div></div></footer><script>(async()=>{const box=document.getElementById('sermonList');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const youtubeId=url=>{if(!url)return'';try{const u=new URL(url);if(u.hostname==='youtu.be'||u.hostname.endsWith('.youtu.be'))return u.pathname.split('/').filter(Boolean)[0]||'';if(u.hostname.includes('youtube.com')){if(u.searchParams.get('v'))return u.searchParams.get('v');const parts=u.pathname.split('/').filter(Boolean);const k=parts.findIndex(x=>['shorts','embed','live'].includes(x));if(k>=0&&parts[k+1])return parts[k+1]}}catch(e){}const m=String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{6,})/);return m?m[1]:''};try{const r=await fetch('/content/sermons.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('sermons');const items=await r.json();if(!Array.isArray(items)||!items.length){box.innerHTML='<div class="sermon-empty">등록된 설교가 없습니다.</div>';return}const sorted=[...items].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));box.innerHTML=sorted.map((s,i)=>{const yid=youtubeId(s.video);const thumb=yid?`https://i.ytimg.com/vi/${yid}/hqdefault.jpg`:(s.image||'');const summary=String(s.text||'');const dot=summary.indexOf('·');const short=dot>=0?summary.slice(0,dot).trim():summary;const media=thumb?`<${s.video?'a':'div'} class="sermon-media${s.video?' video-preview':''}"${s.video?` href="${esc(s.video)}" target="_blank" rel="noopener"`:''}><img src="${esc(thumb)}" alt="${esc(s.title)}" onerror="this.closest('.sermon-media').style.display='none'">${s.video?'<span class="sermon-play" aria-hidden="true"></span>':''}</${s.video?'a':'div'}>`:'';return `<article class="sermon-row${i===0?' open':''}" id="sermon-${i}"><button class="sermon-head" type="button" aria-expanded="${i===0?'true':'false'}"><span class="sermon-date">${esc(s.date)}</span><span class="sermon-title-wrap"><strong>${esc(s.title)}</strong><span>${esc(short)}</span></span><span class="sermon-toggle" aria-hidden="true">›</span></button><div class="sermon-detail"><div class="sermon-detail-inner">${media}<div class="sermon-copy"><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>${s.video?`<div class="sermon-actions"><a class="sermon-watch" href="${esc(s.video)}" target="_blank" rel="noopener">▶ 설교 영상 보기</a></div>`:''}</div></div></div></article>`}).join('');box.querySelectorAll('.sermon-head').forEach(btn=>btn.addEventListener('click',()=>{const row=btn.closest('.sermon-row'),open=row.classList.toggle('open');btn.setAttribute('aria-expanded',open?'true':'false')}));if(location.hash){requestAnimationFrame(()=>{const target=document.querySelector(location.hash);if(target){target.classList.add('open');target.querySelector('.sermon-head')?.setAttribute('aria-expanded','true');target.scrollIntoView({behavior:'smooth',block:'start'})}})}}catch(e){box.innerHTML='<div class="sermon-empty">설교 목록을 불러오지 못했습니다.</div>'}})();</script><script src="/js/nav-dropdowns.js?v=sermonlist1"></script></body></html>
