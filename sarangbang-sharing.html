ingBoard" class="news-board"><div class="news-empty">사랑방 나눔을 불러오는 중입니다.</div></div><div id="sharingPages" class="pagination" aria-label="사랑방 나눔 페이지"></div></div></section></main><footer class="site-footer"><div class="container"><div class="copyright">© 2026 모현소망교회. All rights reserved.</div></div></footer><script src="/js/nav-dropdowns.js?v=unified-pwa-position-20261112"></script><script id="ministry-crossnav-offset">(()=>{const header=document.querySelector(".site-header");if(!header)return;const update=()=>document.documentElement.style.setProperty("--ministry-header-height",Math.ceil(header.getBoundingClientRect().height)+"px");update();window.addEventListener("resize",update,{passive:true});})();</script><script id="sharing-board-script">(async function(){const box=document.getElementById('sharingBoard'),pager=document.getElementById('sharingPages');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let page=1;const perPage=5;try{const r=await fetch('/content/sarangbang-sharing.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('load');const [rawEntries,sermonResponse,site]=await Promise.all([r.json(),fetch('/content/sermons.json?v='+Date.now(),{cache:'no-store'}).then(x=>x.ok?x.json():[]).catch(()=>[]),fetch('/content/site.json?v='+Date.now(),{cache:'no-store'}).then(x=>x.ok?x.json():{}).catch(()=>({}))]);const sortedSermons=[...sermonResponse].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));const latestSermon=sortedSermons[0]||{};const carousel2Image=latestSermon.image||site.worshipImage||site.heroImage||site.churchFrontImage||'';const entries=rawEntries.slice().map(x=>({...x,displayImage:carousel2Image})).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));function render(){const total=Math.max(1,Math.ceil(entries.length/perPage));page=Math.max(1,Math.min(total,page));box.innerHTML=entries.length?entries.slice((page-1)*perPage,page*perPage).map(x=>'<article class="news-row"><button type="button" class="news-head'+(x.displayImage?' has-image':'')+'" aria-expanded="false"><span class="news-date">'+esc(x.date)+'</span>'+(x.displayImage?'<img class="sharing-thumb" src="'+esc(x.displayImage)+'" alt="'+esc(x.title)+' 대표 이미지" loading="lazy">':'')+'<div class="news-title"><h3>'+esc(x.title)+'</h3><p>'+esc(x.summary)+'</p></div><span class="news-toggle" aria-hidden="true">›</span></button><div class="news-detail"><div class="news-detail-inner">'+(x.displayImage?'<img class="sharing-detail-image" src="'+esc(x.displayImage)+'" alt="'+esc(x.title)+' 설교 이미지" loading="lazy">':'')+(x.scripture?'<h4>본문</h4><p>'+esc(x.scripture)+'</p>':'')+(x.summary?'<h4>설교 요약</h4><p>'+esc(x.summary)+'</p>':'')+(x.application?'<h4>말씀 적용</h4><p>'+esc(x.application)+'</p>':'')+(x.meaning?'<h4>사랑방의 의미</h4><p>'+esc(x.meaning)+'</p>':'')+(x.questions?.length?'<h4>함께 나눌 질문</h4><ol>'+x.questions.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol>':'')+(x.invitation?'<h4>나눔 초대</h4><p>'+esc(x.invitation)+'</p>':'')+(x.note?'<p style="font-size:13px;color:#849087">'+esc(x.note)+'</p>':'')+'</div></div></article>').join(''):'<div class="news-empty">등록된 사랑방 나눔이 없습니다.</div>';box.querySelectorAll('.news-head').forEach(b=>b.addEventListener('click',()=>{const row=b.closest('.news-row');const open=row.classList.toggle('open');b.setAttribute('aria-expanded',String(open))}));pager.innerHTML=total<=1?'':'<button id="sharingPrev" '+(page===1?'disabled':'')+'>이전</button><span>'+page+' / '+total+'</span><button id="sharingNext" '+(page===total?'disabled':'')+'>다음</button>';pager.querySelector('#sharingPrev')?.addEventListener('click',()=>{page--;render()});pager.querySelector('#sharingNext')?.addEventListener('click',()=>{page++;render()})}render()}catch(e){box.innerHTML='<div class="news-empty">나눔 게시물을 불러오지 못했습니다.</div>';console.warn(e)}})();</script></body></html>
