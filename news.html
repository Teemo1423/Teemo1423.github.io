<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교회소식 | 모현소망교회</title><link rel="stylesheet" href="/css/church.css?v=newslist1"><style>.news-board{border-top:2px solid var(--green);background:#fff}.news-row{border-bottom:1px solid var(--line)}.news-head{width:100%;display:grid;grid-template-columns:120px minmax(0,1fr) 34px;gap:22px;align-items:center;padding:22px 6px;background:none;border:0;text-align:left;color:inherit;cursor:pointer}.news-date{font-size:13px;font-weight:800;color:var(--green);letter-spacing:.02em}.news-title{min-width:0}.news-title h3{margin:0;font-size:21px;line-height:1.35;letter-spacing:-.03em}.news-title p{margin:6px 0 0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.news-toggle{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#f1f6f3;color:var(--green);font-size:18px;transition:transform .2s ease}.news-row.open .news-toggle{transform:rotate(90deg)}.news-detail{display:none;padding:0 40px 26px 148px}.news-row.open .news-detail{display:block}.news-detail-inner{padding:20px 0 0;border-top:1px dashed var(--line)}.news-detail p{margin:0;color:var(--ink);line-height:1.8;font-size:15px;white-space:pre-line}.news-detail img{display:block;width:100%;max-width:760px;max-height:520px;object-fit:cover;border-radius:18px;margin:18px 0 0}.news-empty{padding:46px 0;text-align:center;color:var(--muted)}@media(max-width:700px){.news-head{grid-template-columns:1fr 30px;gap:10px;padding:19px 2px}.news-date{grid-column:1;font-size:12px;margin-bottom:2px}.news-title{grid-column:1}.news-title h3{font-size:19px}.news-title p{font-size:13px}.news-toggle{grid-column:2;grid-row:1/3;align-self:center}.news-detail{padding:0 2px 22px}.news-detail-inner{padding-top:16px}.news-detail p{font-size:14px}.news-detail img{border-radius:15px}}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/"><img class="brand-logo" src="/assets/site/logo.png" alt="모현소망교회 공식 로고"><span class="brand-copy"><small>MOHYEON SOMANG CHURCH</small><strong>모현소망교회</strong></span></a><nav class="navlinks"></nav></div></header><main><section class="page-hero"><div class="container"><div class="kicker">NEWS</div><h1>교회소식</h1><p>예배와 행사, 교육부서와 공동체의 새로운 소식을 전합니다.</p></div></section><section><div class="container"><div id="newsList" class="news-board"><div class="news-empty">교회소식을 불러오는 중입니다.</div></div></div></section></main><footer class="site-footer"><div class="container"><div class="brand"><img class="brand-logo" src="/assets/site/logo.png" alt="모현소망교회 공식 로고"><span class="brand-copy"><small>MOHYEON SOMANG CHURCH</small><strong>모현소망교회</strong></span></div><div class="copyright">© 2026 모현소망교회. All rights reserved.</div></div></footer><script>(async()=>{const box=document.getElementById('newsList');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));try{const r=await fetch('/content/news.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('news');const items=await r.json();if(!Array.isArray(items)||!items.length){box.innerHTML='<div class="news-empty">등록된 교회소식이 없습니다.</div>';return}box.innerHTML=items.map((n,i)=>`<article class="news-row"><button class="news-head" type="button" aria-expanded="false"><div class="news-date">${esc(n.date||'')}</div><div class="news-title"><h3>${esc(n.title||'제목 없음')}</h3><p>${esc(n.text||'')}</p></div><span class="news-toggle" aria-hidden="true">›</span></button><div class="news-detail"><div class="news-detail-inner"><p>${esc(n.text||'')}</p>${n.image?`<img src="${esc(n.image)}?v=${Date.now()}" alt="${esc(n.title||'교회소식')}" loading="lazy" onerror="this.style.display='none'">`:''}</div></div></article>`).join('');box.querySelectorAll('.news-row').forEach(row=>{const btn=row.querySelector('.news-head');btn.addEventListener('click',()=>{const open=row.classList.toggle('open');btn.setAttribute('aria-expanded',open?'true':'false')})})}catch(e){box.innerHTML='<div class="news-empty">교회소식을 불러오지 못했습니다.</div>'}})();</script><script src="/js/nav-dropdowns.js?v=menu11"></script></body></html>
