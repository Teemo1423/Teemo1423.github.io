<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교회소식 | 모현소망교회</title><link rel="stylesheet" href="/css/church.css?v=newslist4"><style>.news-board{border-top:2px solid var(--green);background:#fff}.news-row{border-bottom:1px solid var(--line)}.news-head{width:100%;display:grid;grid-template-columns:120px minmax(0,1fr) 34px;gap:22px;align-items:center;padding:22px 6px;background:none;border:0;text-align:left;color:inherit;cursor:pointer}.news-date{font-size:13px;font-weight:800;color:var(--green);letter-spacing:.02em}.news-title{min-width:0}.news-title h3{margin:0;font-size:21px;line-height:1.35;letter-spacing:-.03em}.news-title p{margin:6px 0 0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.news-toggle{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#f1f6f3;color:var(--green);font-size:18px;transition:transform .2s ease}.news-row.open .news-toggle{transform:rotate(90deg)}.news-detail{display:none;padding:0 40px 26px 148px}.news-row.open .news-detail{display:block}.news-detail-inner{padding:20px 0 0;border-top:1px dashed var(--line)}.news-subtitle{margin:0 0 14px!important;color:var(--green)!important;font-weight:800;line-height:1.65!important}.news-detail p{margin:0;color:var(--ink);line-height:1.8;font-size:15px;white-space:pre-line}.news-detail img{display:block;width:100%;max-width:760px;max-height:520px;object-fit:cover;border-radius:18px;margin:18px 0 0}.news-empty{padding:46px 0;text-align:center;color:var(--muted)}.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:28px;flex-wrap:wrap}.pagination button{min-width:38px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:800;cursor:pointer}.pagination button.active{background:var(--green);border-color:var(--green);color:#fff}.pagination button:disabled{opacity:.35;cursor:default}@media(max-width:700px){.news-head{grid-template-columns:1fr 30px;gap:10px;padding:19px 2px}.news-date{grid-column:1;font-size:12px;margin-bottom:2px}.news-title{grid-column:1}.news-title h3{font-size:19px}.news-title p{font-size:13px}.news-toggle{grid-column:2;grid-row:1/3;align-self:center}.news-detail{padding:0 2px 22px}.news-detail-inner{padding-top:16px}.news-detail p{font-size:14px}.news-detail img{border-radius:15px}}.news-tabs{display:flex;gap:9px;margin:0 0 28px;flex-wrap:wrap}.news-tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}.news-tab.active{background:var(--green);border-color:var(--green);color:#fff}.story-intro{display:none;margin:0 0 22px;padding:22px 24px;border-radius:20px;background:linear-gradient(135deg,#edf6f0,#fbfaf7);border:1px solid #dce9e1}.story-intro.show{display:block}.story-intro .kicker{font-size:11px}.story-intro h2{margin:3px 0 5px;font-size:23px;letter-spacing:-.04em}.story-intro p{margin:0;color:var(--muted);font-size:14px}.story-badge{display:inline-flex;margin-left:8px;padding:3px 7px;border-radius:999px;background:#e9f2ed;color:var(--green);font-size:10px;font-weight:900;vertical-align:middle}@media(max-width:700px){.news-tabs{gap:7px;margin-bottom:18px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.news-tab{flex:0 0 auto;padding:9px 13px;font-size:13px}.story-intro{padding:17px 18px;border-radius:16px}.story-intro h2{font-size:20px}.story-intro p{font-size:13px;line-height:1.55}}.image-credit,.media-credit{margin-top:7px!important;font-size:12px!important;color:var(--muted)!important}.image-credit a,.media-credit a{color:inherit;text-decoration:underline;text-underline-offset:2px}.story-link{display:inline-flex;align-items:center;gap:7px;margin-top:18px;padding:11px 16px;border-radius:999px;background:var(--green);color:#fff!important;font-size:14px;font-weight:900;text-decoration:none}.story-link:hover{filter:brightness(.95)}@media(max-width:700px){.story-link{width:100%;justify-content:center;box-sizing:border-box;font-size:14px}}</style><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/"><img class="brand-logo" src="/assets/site/logo.png" alt="모현소망교회 공식 로고"><span class="brand-copy"><small>MOHYEON SOMANG CHURCH</small><strong>모현소망교회</strong></span></a><nav class="navlinks"></nav></div></header><main><section class="page-hero"><div class="container"><div class="kicker">NEWS</div><h1>교회소식</h1><p>예배와 행사, 교육부서와 공동체의 새로운 소식을 전합니다.</p></div></section><section><div class="container"><div class="news-tabs" role="tablist" aria-label="교회소식 분류"><button class="news-tab active" data-filter="all" type="button">전체소식</button><button class="news-tab" data-filter="notice" type="button">주보 · 공지</button><button class="news-tab" data-filter="story" type="button">모현소망 이야기</button></div><div id="storyIntro" class="story-intro"><div class="kicker">MOHYEON SOMANG STORY</div><h2>모현소망 이야기</h2><p>교회 밖에서도 이어지는 모현소망교회의 발걸음과 성도들의 이야기를 전합니다.</p></div><div id="newsList" class="news-board"><div class="news-empty">교회소식을 불러오는 중입니다.</div></div><div id="newsPagination" class="pagination" aria-label="교회소식 페이지"></div></div></section></main><footer class="site-footer"><div class="container"><div class="brand"><img class="brand-logo" src="/assets/site/logo.png" alt="모현소망교회 공식 로고"><span class="brand-copy"><small>MOHYEON SOMANG CHURCH</small><strong>모현소망교회</strong></span></div><div class="copyright">© 2026 모현소망교회. All rights reserved.</div></div></footer><script>(async()=>{const box=document.getElementById('newsList'),pager=document.getElementById('newsPagination'),intro=document.getElementById('storyIntro'),tabs=[...document.querySelectorAll('.news-tab')],PER_PAGE=5;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const isStory=n=>String(n.category||n.type||'').toLowerCase()==='story'||/모현소망 이야기|외부활동/.test(String(n.category||n.type||n.tags||''));try{const r=await fetch('/content/news.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('news');const items=await r.json();if(!Array.isArray(items)){throw new Error('news')};let filter=new URLSearchParams(location.search).get('category')||'all',page=1;const filtered=()=>filter==='story'?items.filter(isStory):filter==='notice'?items.filter(n=>!isStory(n)):items;function render(){const list=filtered(),total=Math.max(1,Math.ceil(list.length/PER_PAGE));page=Math.min(total,Math.max(1,page));tabs.forEach(t=>t.classList.toggle('active',t.dataset.filter===filter));intro.classList.toggle('show',filter==='story');if(!list.length){box.innerHTML='<div class="news-empty">'+(filter==='story'?'아직 등록된 모현소망 이야기가 없습니다. 첫 이야기를 준비하고 있습니다.':'등록된 교회소식이 없습니다.')+'</div>';pager.innerHTML='';return}const slice=list.slice((page-1)*PER_PAGE,page*PER_PAGE);box.innerHTML=slice.map(n=>{const sub=String(n.subtitle||n.text||'').trim(),story=isStory(n);return `<article class="news-row"><button class="news-head" type="button" aria-expanded="false"><div class="news-date">${esc(n.date||'')}</div><div class="news-title"><h3>${esc(n.title||'제목 없음')}${story?'<span class="story-badge">이야기</span>':''}</h3><p>${esc(sub)}</p></div><span class="news-toggle" aria-hidden="true">›</span></button><div class="news-detail"><div class="news-detail-inner">${n.subtitle?`<p class="news-subtitle">${esc(n.subtitle)}</p>`:''}<p>${esc(n.body||n.text||'')}</p>${n.image?`<img src="${esc(n.image)}${String(n.image).includes('?')?'&':'?'}v=${Date.now()}" alt="${esc(n.title||'교회소식')}" loading="lazy" onerror="this.style.display='none'">${n.imageCredit?`<p class="image-credit">${n.imageCreditUrl?`<a href="${esc(n.imageCreditUrl)}" target="_blank" rel="noopener">${esc(n.imageCredit)}</a>`:esc(n.imageCredit)}</p>`:''}`:''}${n.mediaCredit?`<p class="media-credit">${n.mediaCreditUrl?`<a href="${esc(n.mediaCreditUrl)}" target="_blank" rel="noopener">${esc(n.mediaCredit)}</a>`:esc(n.mediaCredit)}</p>`:''}${n.externalUrl?`<a class="story-link" href="${esc(n.externalUrl)}" target="_blank" rel="noopener">${/youtu|youtube/i.test(n.externalUrl)?'영상 보기 ▶':'기사 원문 보기 ↗'}</a>`:''}</div></div></article>`}).join('');box.querySelectorAll('.news-row').forEach(row=>{const btn=row.querySelector('.news-head');btn.onclick=()=>{const open=row.classList.toggle('open');btn.setAttribute('aria-expanded',open?'true':'false')}});pager.innerHTML=total<=1?'':`<button type="button" data-page="${page-1}" ${page===1?'disabled':''}>이전</button>${Array.from({length:total},(_,i)=>`<button type="button" data-page="${i+1}" class="${page===i+1?'active':''}">${i+1}</button>`).join('')}<button type="button" data-page="${page+1}" ${page===total?'disabled':''}>다음</button>`;pager.querySelectorAll('button[data-page]:not(:disabled)').forEach(b=>b.onclick=()=>{page=Number(b.dataset.page);render()})}tabs.forEach(t=>t.onclick=()=>{filter=t.dataset.filter;page=1;const u=new URL(location.href);if(filter==='all')u.searchParams.delete('category');else u.searchParams.set('category',filter);u.searchParams.delete('page');history.replaceState({},'',u);render()});render()}catch(e){box.innerHTML='<div class="news-empty">교회소식을 불러오지 못했습니다.</div>'}})();</script><script src="/js/nav-dropdowns.js?v=storylive1"></script></body></html>
