<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진첩 | 모현소망교회</title><link rel="stylesheet" href="/css/church.css?v=gallery3"><style>.gallery-filter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}.gallery-filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-weight:800;color:var(--ink);cursor:pointer}.gallery-filter button.active{background:var(--green);color:#fff;border-color:var(--green)}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.photo-card{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:#fff;cursor:default!important}.photo-card.smart-link-card{transform:none!important;box-shadow:none!important;border-color:var(--line)!important}.photo-card .smart-link-arrow{display:none!important}.photo-media{aspect-ratio:4/3;background:#edf3ef;overflow:hidden}.photo-media img{width:100%;height:100%;object-fit:cover;display:block}.photo-copy{padding:18px 20px 22px}.photo-meta{display:flex;gap:8px;align-items:center;color:var(--green);font-size:12px;font-weight:800}.photo-copy h3{font-size:21px;margin:6px 0}.photo-copy p{margin:0;color:var(--muted);font-size:14px}.gallery-empty{display:none;padding:40px;text-align:center;color:var(--muted)}@media(max-width:900px){.photo-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.photo-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/"><img class="brand-logo" src="/assets/site/logo.png" alt="모현소망교회 공식 로고"><span class="brand-copy"><small>MOHYEON SOMANG CHURCH</small><strong>모현소망교회</strong></span></a><nav class="navlinks"><a href="/">홈</a><a href="/about.html">교회소개</a><a href="/worship.html">예배안내</a><a href="/ministries.html">교육·사역</a><a href="/sermons.html">설교</a><a href="/news.html">소식</a><a class="active" href="/gallery.html">사진첩</a><a href="/visit.html">오시는 길</a></nav></div></header><main><section class="page-hero"><div class="container"><div class="kicker">GALLERY</div><h1>교회 사진첩</h1><p>예배와 공동체, 다음세대와 교회의 소중한 순간을 사진으로 나눕니다.</p></div></section><section><div class="container"><div class="gallery-filter"><button class="active" data-gallery-filter="전체">전체</button><button data-gallery-filter="교회">교회</button><button data-gallery-filter="예배">예배</button><button data-gallery-filter="공동체">공동체</button><button data-gallery-filter="다음세대">다음세대</button></div><div class="photo-grid" data-gallery-list><article class="photo-card"><div class="photo-copy"><div class="photo-meta">불러오는 중…</div><h3>사진을 준비하고 있습니다.</h3></div></article></div><div class="gallery-empty" data-gallery-empty>이 카테고리에는 아직 사진이 없습니다.</div></div></section></main><footer class="site-footer"><div class="container"><div class="brand"><img class="brand-logo" src="/assets/site/logo.png" alt="모현소망교회 공식 로고"><span class="brand-copy"><small>MOHYEON SOMANG CHURCH</small><strong>모현소망교회</strong></span></div><div class="copyright">© 2026 모현소망교회. All rights reserved.</div></div></footer><script src="/js/site-data.js?v=facilityphotos2"></script><script>(()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const box=document.querySelector('[data-gallery-list]'),empty=document.querySelector('[data-gallery-empty]'),buttons=[...document.querySelectorAll('[data-gallery-filter]')];let items=[];const render=(cat='전체')=>{const filtered=cat==='전체'?items:items.filter(x=>x.category===cat);box.innerHTML=filtered.map(x=>`<article class="photo-card"><div class="photo-media"><img src="${esc(x.image)}?v=20260905facility" alt="${esc(x.title)}" loading="lazy"></div><div class="photo-copy"><div class="photo-meta">${esc(x.category)} · ${esc(x.date)}</div><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div></article>`).join('');empty.style.display=filtered.length?'none':'block'};buttons.forEach(b=>b.addEventListener('click',()=>{buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.galleryFilter)}));fetch('/content/gallery.json?v=20260905facility',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('gallery');return r.json()}).then(data=>{items=Array.isArray(data)?data:[];render('전체')}).catch(()=>{box.innerHTML='<article class="photo-card"><div class="photo-copy"><h3>사진을 불러오지 못했습니다.</h3><p>잠시 후 다시 시도해주세요.</p></div></article>'})})();</script><script src="/js/nav-dropdowns.js?v=facilityphotos2"></script></body></html>
