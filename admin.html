<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교회 홈페이지 관리자</title><link rel="stylesheet" href="/css/admin.css"></head><body><main class="admin"><div class="topbar"><div><h1>모현소망교회 관리자</h1><p class="muted">GitHub 저장소의 교회 정보·예배·소식·설교·이미지를 직접 수정합니다.</p></div><a class="btn" href="/index.html?v=church3" target="_blank">홈페이지 보기</a></div><div id="status" class="status">관리자 연결 전입니다.</div><section id="loginbox" class="panel"><h2>GitHub 관리자 연결</h2><p class="muted">Fine-grained Personal Access Token을 입력하세요. 이 페이지는 토큰을 브라우저 저장소에 보관하지 않습니다. 저장소 Contents 읽기/쓰기 권한이 필요합니다.</p><label>GitHub Token</label><input id="token" type="password" placeholder="github_pat_..."><p><button onclick="login()">관리자 연결</button></p></section><div id="editor" style="display:none"><section class="panel"><h2>교회 기본정보</h2><div class="grid"><div><label>교회명</label><input id="churchName"></div><div><label>영문명</label><input id="churchNameEn"></div><div class="full"><label>메인 문구</label><textarea id="heroTitle"></textarea></div><div class="full"><label>메인 설명</label><textarea id="heroText"></textarea></div><div class="full"><label>메인 이미지 경로</label><input id="heroImage" placeholder="/assets/uploads/..."></div><div class="full"><label>교회소개 본문</label><textarea id="aboutText"></textarea></div><div class="full"><label>주소</label><input id="address"></div><div><label>전화번호</label><input id="phone"></div><div><label>이메일</label><input id="email"></div><div class="full"><label>카카오톡/채널</label><input id="kakao"></div></div><h3>예배 시간</h3><div id="worshipList"></div><button onclick="addWorship()">예배 추가</button> <button onclick="saveSite()">기본정보 저장</button></section><section class="panel"><h2>이미지 관리</h2><p class="muted">사진을 업로드한 뒤 생성된 경로를 메인 이미지, 교회소식, 설교 이미지 칸에 붙여넣으면 됩니다.</p><input id="imageFile" type="file" accept="image/*"><p><button onclick="uploadImage()">이미지 업로드</button></p><label>최근 업로드 경로</label><input id="uploadedPath" readonly><div id="imageList" class="thumbs" style="margin-top:14px"></div></section><section class="panel"><div class="topbar"><div><h2>교회소식</h2></div><button onclick="addNews()">새 소식 추가</button></div><div id="newsList"></div><button onclick="saveNews()">교회소식 저장</button></section><section class="panel"><div class="topbar"><div><h2>설교</h2></div><button onclick="addSermon()">새 설교 추가</button></div><div id="sermonList"></div><button onclick="saveSermons()">설교 저장</button></section></div></main><script src="/js/admin.js"></script></body></html>
