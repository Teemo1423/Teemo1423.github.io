<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이번 주 말씀묵상 | 모현소망교회</title><meta name="description" content="모현소망교회의 주간 말씀묵상입니다. 주일 말씀을 본문과 핵심 적용으로 다시 묵상해 보세요."><link rel="canonical" href="https://mohyeonsomang.org/weekly-meditation.html"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/css/church.css?v=universal1"><style>.med-wrap{padding:42px 0 44px}.med-card{max-width:900px;margin:auto}.med-label{font-size:12px;letter-spacing:.18em;font-weight:900;color:var(--green)}.med-card h1{font-size:clamp(42px,7vw,72px);letter-spacing:-.055em;line-height:1.04;margin:12px 0 8px}.med-scripture{font-size:20px;font-weight:900;color:var(--green);margin-bottom:26px}.med-summary{font-size:21px;line-height:1.75;font-weight:800;letter-spacing:-.025em;margin:0 0 34px}.med-body{display:grid;gap:18px}.med-body p{margin:0;font-size:17px;line-height:2;color:#36463e}.med-points{margin:38px 0 0;padding:26px;border-radius:22px;background:#eef5f1}.med-points h2{margin:0 0 12px;font-size:21px}.med-points ol{margin:0;padding-left:22px;display:grid;gap:10px}.med-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}.med-actions a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--green);color:#fff;font-weight:900}.med-actions a.alt{background:#fff;color:var(--green);border:1px solid var(--line)}.archive{padding:18px 0 90px}.archive-inner{max-width:900px;margin:auto;border-top:1px solid var(--line);padding-top:42px}.archive-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.archive-head h2{font-size:32px;margin:0;letter-spacing:-.04em}.archive-head p{margin:0;color:#718078}.archive-list{display:grid;gap:12px}.archive-item{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:20px;padding:22px 24px;border:1px solid var(--line);border-radius:20px;background:#fff;transition:.18s}.archive-item:hover{transform:translateY(-2px);border-color:#9ab5a5}.archive-date{font-weight:900;color:var(--green)}.archive-title{font-size:19px;font-weight:900;letter-spacing:-.025em}.archive-scripture{font-size:14px;color:#718078;margin-top:5px}.archive-arrow{font-size:25px;color:var(--green)}@media(max-width:820px){.med-wrap{padding:28px 0 28px}.med-summary{font-size:18px}.med-body p{font-size:16px}.med-actions{display:grid}.med-actions a{justify-content:center;width:100%}.archive{padding:10px 0 70px}.archive-head{display:block}.archive-head h2{font-size:27px}.archive-head p{margin-top:7px}.archive-item{grid-template-columns:1fr auto;gap:8px 12px;padding:19px}.archive-date{grid-column:1}.archive-item>div:nth-child(2){grid-column:1}.archive-arrow{grid-column:2;grid-row:1/3}}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/"><img class="brand-logo" src="/assets/site/logo.png" alt="모현소망교회 공식 로고"><span class="brand-copy"><small>MOHYEON SOMANG CHURCH</small><strong>모현소망교회</strong></span></a><nav class="navlinks"></nav></div></header><main><section class="med-wrap"><div class="container"><article class="med-card" id="meditationRoot"><p>말씀묵상을 불러오는 중입니다.</p></article></div></section><section class="archive"><div class="container"><div class="archive-inner"><div class="archive-head"><div><div class="kicker">ARCHIVE</div><h2>지난 말씀묵상</h2></div><p>주차별 말씀을 다시 묵상해 보세요.</p></div><div class="archive-list" id="archiveList"></div></div></div></section></main><footer class="site-footer"></footer><script>(async()=>{const root=document.getElementById('meditationRoot'),list=document.getElementById('archiveList');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));try{const [mr,hr]=await Promise.all([fetch('/content/meditation.json?v='+Date.now(),{cache:'no-store'}),fetch('/content/meditation-history.json?v='+Date.now(),{cache:'no-store'})]);if(!mr.ok)throw new Error('meditation');const current=await mr.json(),history=hr.ok?await hr.json():[current];const items=Array.isArray(history)?history:[];const key=new URLSearchParams(location.search).get('date');const d=(key&&items.find(x=>String(x.date)===key))||current;const body=Array.isArray(d.body)?d.body:[],pts=Array.isArray(d.points)?d.points:[];root.innerHTML=`<div class="med-label">${esc(d.date||'')} · ${esc(d.label||'WEEKLY MEDITATION')}</div><h1>${esc(d.title||'말씀묵상')}</h1><div class="med-scripture">${esc(d.scripture||'')}</div><p class="med-summary">${esc(d.summary||'')}</p><div class="med-body">${body.map(p=>`<p>${esc(p)}</p>`).join('')}</div>${pts.length?`<div class="med-points"><h2>이번 주 핵심 말씀</h2><ol>${pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div>`:''}<div class="med-actions">${!key||String(d.date)===String(current.date)?'<a href="/sermons.html#sermon-0">이번 주 설교 보기</a>':''}<a class="alt" href="/">홈으로 돌아가기</a></div>`;const sorted=[...items].sort((a,b)=>String(b.date).localeCompare(String(a.date)));list.innerHTML=sorted.map(x=>`<a class="archive-item" href="/weekly-meditation.html?date=${encodeURIComponent(x.date)}"><div class="archive-date">${esc(x.date)}</div><div><div class="archive-title">${esc(x.title)}</div><div class="archive-scripture">${esc(x.scripture)}</div></div><div class="archive-arrow">→</div></a>`).join('')||'<p>아직 지난 묵상이 없습니다.</p>'}catch(e){root.innerHTML='<p>말씀묵상을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>'}})();</script><script src="/js/nav-dropdowns.js?v=medarchive1"></script></body></html>
