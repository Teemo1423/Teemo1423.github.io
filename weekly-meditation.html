<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이번 주 말씀묵상 | 모현소망교회</title><meta name="description" content="모현소망교회의 이번 주 말씀묵상입니다. 주일 말씀을 본문과 핵심 적용으로 다시 묵상해 보세요."><link rel="canonical" href="https://mohyeonsomang.org/weekly-meditation.html"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/css/church.css?v=universal1"><style>.med-hero{padding:72px 0 42px;background:#f4f7f4}.med-wrap{padding:54px 0 84px}.med-card{max-width:900px;margin:auto}.med-label{font-size:12px;letter-spacing:.18em;font-weight:900;color:var(--green)}.med-card h1{font-size:clamp(42px,7vw,72px);letter-spacing:-.055em;line-height:1.04;margin:12px 0 8px}.med-scripture{font-size:20px;font-weight:900;color:var(--green);margin-bottom:26px}.med-summary{font-size:21px;line-height:1.75;font-weight:800;letter-spacing:-.025em;margin:0 0 34px}.med-body{display:grid;gap:18px}.med-body p{margin:0;font-size:17px;line-height:2;color:#36463e}.med-points{margin:38px 0 0;padding:26px;border-radius:22px;background:#eef5f1}.med-points h2{margin:0 0 12px;font-size:21px}.med-points ol{margin:0;padding-left:22px;display:grid;gap:10px}.med-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}.med-actions a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--green);color:#fff;font-weight:900}.med-actions a.alt{background:#fff;color:var(--green);border:1px solid var(--line)}@media(max-width:820px){.med-hero{padding:48px 0 30px}.med-wrap{padding:36px 0 60px}.med-summary{font-size:18px}.med-body p{font-size:16px}.med-actions{display:grid}.med-actions a{justify-content:center;width:100%}}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/"><img class="brand-logo" src="/assets/site/logo.png" alt="모현소망교회 공식 로고"><span class="brand-copy"><small>MOHYEON SOMANG CHURCH</small><strong>모현소망교회</strong></span></a><nav class="navlinks"></nav></div></header><main><section class="med-hero"><div class="container"><div class="kicker">WEEKLY MEDITATION</div><h1 class="section-title">이번 주 말씀묵상</h1><p class="section-lead">주일에 선포된 말씀을 한 주의 삶 속에서 다시 천천히 묵상합니다.</p></div></section><section class="med-wrap"><div class="container"><article class="med-card" id="meditationRoot"><p>말씀묵상을 불러오는 중입니다.</p></article></div></section></main><footer class="site-footer"></footer><script>(async()=>{const root=document.getElementById('meditationRoot');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const scriptureOf=s=>String(s?.text||'').split('·')[0].trim();try{const [mr,sr]=await Promise.all([fetch('/content/meditation.json?v='+Date.now(),{cache:'no-store'}),fetch('/content/sermons.json?v='+Date.now(),{cache:'no-store'})]);if(!mr.ok)throw new Error('meditation');const d=await mr.json();const sermons=sr.ok?await sr.json():[];const sermon=Array.isArray(sermons)?sermons[0]:null;if(sermon){d.title=sermon.title||d.title;d.scripture=scriptureOf(sermon)||d.scripture;d.date=sermon.date||d.date}const body=Array.isArray(d.body)?d.body:[];const pts=Array.isArray(d.points)?d.points:[];root.innerHTML=`<div class="med-label">${esc(d.date||'')} · ${esc(d.label||'WEEKLY MEDITATION')}</div><h1>${esc(d.title||'이번 주 말씀묵상')}</h1><div class="med-scripture">${esc(d.scripture||'')}</div><p class="med-summary">${esc(d.summary||'')}</p><div class="med-body">${body.map(p=>`<p>${esc(p)}</p>`).join('')}</div>${pts.length?`<div class="med-points"><h2>이번 주 핵심 말씀</h2><ol>${pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div>`:''}<div class="med-actions"><a href="/sermons.html#sermon-0">이번 주 설교 보기</a><a class="alt" href="/">홈으로 돌아가기</a></div>`}catch(e){root.innerHTML='<p>말씀묵상을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>'}})();</script><script src="/js/nav-dropdowns.js?v=contentupgrade1"></script></body></html>
